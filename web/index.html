<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rainbow — play</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --panel: #171b25;
    --line: #262c3a;
    --ink: #e6e9f0;
    --dim: #8b93a7;
    --ok: #3ddc84;
    --bad: #ff6b6b;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  h1 { font-size: 1rem; margin: 0; letter-spacing: .04em; }
  h1 span { color: var(--dim); font-weight: 400; }

  #stage {
    position: relative;
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    background: #0a0c12;
    line-height: 0;
  }
  canvas {
    display: block;
    width: 960px; max-width: 92vw; height: auto;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute; inset: 0;
    display: none; place-items: center;
    background: rgba(8,10,16,.86);
    line-height: 1.55; text-align: center; padding: 20px;
  }
  #overlay.show { display: grid; }
  #overlay h2 { margin: 0 0 .4rem; font-size: 1.25rem; }

  .panel {
    width: 960px; max-width: 92vw;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  label { color: var(--dim); }
  input {
    background: #0d1017; color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    padding: .4rem .5rem; font: inherit;
  }
  input#player { width: 25rem; max-width: 60vw; }
  input#verifier { width: 22rem; max-width: 60vw; }
  input#k { width: 4rem; }
  button {
    background: var(--accent); color: #0b1020; font: inherit; font-weight: 700;
    border: 0; border-radius: 4px; padding: .45rem .9rem; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #hud { display: flex; gap: 18px; flex-wrap: wrap; }
  #hud b { color: var(--dim); font-weight: 400; }

  #log {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    max-height: 15rem; overflow: auto; color: var(--dim);
  }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .key { display: inline-block; border: 1px solid var(--line); border-radius: 3px; padding: 0 .35rem; }
</style>
</head>
<body>

<h1>Rainbow <span>— run, jump, stomp. The enclave recomputes your score.</span></h1>

<div id="stage">
  <canvas id="c" width="320" height="240"></canvas>
  <div id="overlay"><div id="overlayText"></div></div>
</div>

<div class="panel">
  <div id="hud">
    <span><b>score</b> <span id="s-score">0</span></span>
    <span><b>lives</b> <span id="s-lives">-</span></span>
    <span><b>coins</b> <span id="s-coins">0</span></span>
    <span><b>tick</b> <span id="s-tick">0</span></span>
    <span><b>log</b> <span id="s-log">0</span> entries</span>
    <span><b>seed</b> <span id="s-seed">—</span></span>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label for="player">player</label>
    <input id="player" value="0x00000000000000000000000000000000000000A1" spellcheck="false" />
    <label for="k">slot k</label>
    <input id="k" type="number" min="0" value="0" />
  </div>
  <div class="row">
    <label for="verifier">verifier</label>
    <input id="verifier" placeholder="https://&lt;tunnel&gt;" spellcheck="false" />
    <button id="btn-session">New session</button>
    <button id="btn-attest" class="ghost" disabled>Attest &amp; submit</button>
    <span style="color:var(--dim)">
      move <span class="key">← →</span> jump <span class="key">space</span> restart <span class="key">R</span>
    </span>
  </div>
</div>

<div class="panel"><pre id="log">Enter the verifier URL and press “New session”.
The seed is derived inside the enclave — the level cannot be drawn without it.</pre></div>

<script type="module">
// ---------------------------------------------------------------------------
// Rainbow game client.
//
// The one rule that matters here: this file never implements game rules. It
// steps sim.wasm and draws whatever comes back. A JavaScript reimplementation
// of the physics would be a second set of rules, it would drift from the
// enclave's, and honest players would start getting flagged as cheats.
//
// What this file is responsible for is the input log: recording, for each tick,
// exactly which buttons were held. That log is the only thing the enclave
// accepts, and it must line up tick-for-tick with what was simulated here.
// ---------------------------------------------------------------------------

const TICK_HZ = 60;
const TICK_MS = 1000 / TICK_HZ;
const FX = 65536;                 // 16.16 fixed point, matching crates/sim/src/fx.rs

const BUTTON_LEFT = 1, BUTTON_RIGHT = 2, BUTTON_JUMP = 4;

const TILE_EMPTY = 0, TILE_SOLID = 1, TILE_SPIKE = 2, TILE_GOAL = 3;

const $ = (id) => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
const VIEW_W = canvas.width, VIEW_H = canvas.height;

const say = (msg, cls = "") => {
  const el = $("log");
  el.innerHTML += `\n${cls ? `<span class="${cls}">${msg}</span>` : msg}`;
  el.scrollTop = el.scrollHeight;
};

// ---------------------------------------------------------------------------
// wasm
// ---------------------------------------------------------------------------

const {instance: wasm} = await WebAssembly.instantiateStreaming(fetch("./sim.wasm"), {});
const w = wasm.exports;

if (w.sim_abi_version() !== 2) throw new Error(`sim.wasm ABI ${w.sim_abi_version()}, expected 2`);

const LEVEL_W = w.sim_level_w();
const LEVEL_H = w.sim_level_h();
const TILE = w.sim_tile_size();
const MAX_ENEMIES = w.sim_max_enemies();
const MAX_COINS = w.sim_max_coins();
const SNAP_SIZE = w.sim_snapshot_size();

// Scratch buffers, allocated once. Reallocating per frame would churn the wasm
// heap 60 times a second for no reason.
const snapPtr = w.sim_alloc(SNAP_SIZE);
const terrainPtr = w.sim_alloc(LEVEL_W * LEVEL_H);

/** Linear memory can be detached by growth, so the view is rebuilt per read. */
const mem = () => new DataView(w.memory.buffer);
const bytes = () => new Uint8Array(w.memory.buffer);

// ---------------------------------------------------------------------------
// Session state
// ---------------------------------------------------------------------------

let handle = 0;          // live sim.wasm state
let terrain = null;      // Uint8Array copy of the generated level
let session = null;      // {seed, epoch, k, sessionId, ...} from the enclave
let inputLog = [];       // [[tick, buttons], …] — the only thing the enclave gets
let steps = 0;           // ticks simulated so far; equals State.tick
let lastButtons = 0;
let running = false;
let finalSnap = null;

const held = new Set();

function currentButtons() {
  let b = 0;
  if (held.has("left")) b |= BUTTON_LEFT;
  if (held.has("right")) b |= BUTTON_RIGHT;
  if (held.has("jump")) b |= BUTTON_JUMP;
  return b;
}

// ---------------------------------------------------------------------------
// Simulation stepping
// ---------------------------------------------------------------------------

/**
 * Advance exactly one tick.
 *
 * The log entry is pushed BEFORE stepping and stamped with `steps`, which is the
 * simulation's current tick value. That is precisely the convention `replay_with`
 * uses on the other side: at `state.tick == T` it applies every entry whose tick
 * is T, then steps. Getting this off by one would produce a run the enclave
 * replays differently, and the score would silently disagree.
 */
function stepOnce() {
  const b = currentButtons();
  if (b !== lastButtons) {
    inputLog.push([steps, b]);
    lastButtons = b;
  }
  const over = w.sim_step_one(handle, b);
  steps++;
  if (over < 0) throw new Error(`sim_step_one status ${over}`);
  return over === 1;
}

function readSnapshot() {
  const n = w.sim_snapshot(handle, snapPtr, SNAP_SIZE);
  if (n < 0) throw new Error(`sim_snapshot status ${n}`);
  const d = mem();
  const at = (o) => snapPtr + o;

  const s = {
    tick: d.getUint32(at(0), true),
    x: d.getInt32(at(4), true) / FX,
    y: d.getInt32(at(8), true) / FX,
    vx: d.getInt32(at(12), true) / FX,
    vy: d.getInt32(at(16), true) / FX,
    onGround: d.getUint8(at(20)),
    facing: d.getInt8(at(21)),
    lives: d.getUint8(at(22)),
    over: d.getUint8(at(23)),
    won: d.getUint8(at(24)),
    invuln: d.getUint8(at(25)),
    coins: d.getUint32(at(28), true),
    score: d.getBigUint64(at(32), true),
    enemies: [],
    coinsOnField: [],
  };

  let off = 48;
  for (let i = 0; i < MAX_ENEMIES; i++, off += 12) {
    if (d.getUint8(at(off + 8)) === 0) continue;
    s.enemies.push({x: d.getInt32(at(off), true) / FX, y: d.getInt32(at(off + 4), true) / FX});
  }
  for (let i = 0; i < MAX_COINS; i++, off += 12) {
    if (d.getUint8(at(off + 8)) === 0) continue;
    s.coinsOnField.push({x: d.getInt32(at(off), true) / FX, y: d.getInt32(at(off + 4), true) / FX});
  }
  return s;
}

// ---------------------------------------------------------------------------
// Rendering — deliberately basic shapes
// ---------------------------------------------------------------------------

function draw(s) {
  // Camera follows the player, clamped to the level bounds.
  let camX = s.x - VIEW_W / 2;
  camX = Math.max(0, Math.min(camX, LEVEL_W * TILE - VIEW_W));
  const ox = Math.round(camX);

  ctx.fillStyle = "#0d1119";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Parallax band, purely so motion is legible.
  ctx.fillStyle = "#141a26";
  for (let i = 0; i < 12; i++) {
    const bx = ((i * 140 - ox * 0.35) % (VIEW_W + 140)) - 70;
    ctx.fillRect(bx, 150, 90, 90);
  }

  const tx0 = Math.max(0, Math.floor(ox / TILE));
  const tx1 = Math.min(LEVEL_W - 1, Math.ceil((ox + VIEW_W) / TILE));

  for (let ty = 0; ty < LEVEL_H; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const t = terrain[ty * LEVEL_W + tx];
      if (t === TILE_EMPTY) continue;
      const px = tx * TILE - ox, py = ty * TILE;

      if (t === TILE_SOLID) {
        ctx.fillStyle = "#3b4a63";
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = "#54688a";
        ctx.fillRect(px, py, TILE, 3);
      } else if (t === TILE_SPIKE) {
        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath();
        ctx.moveTo(px, py + TILE);
        ctx.lineTo(px + TILE / 2, py + 2);
        ctx.lineTo(px + TILE, py + TILE);
        ctx.closePath();
        ctx.fill();
      } else if (t === TILE_GOAL) {
        ctx.fillStyle = "#3ddc84";
        ctx.fillRect(px + TILE / 2 - 2, py, 4, TILE);
      }
    }
  }

  // Coins — circles.
  ctx.fillStyle = "#ffd166";
  for (const c of s.coinsOnField) {
    ctx.beginPath();
    ctx.arc(c.x - ox, c.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Enemies — squares with eyes, so facing is visible at 16px.
  for (const e of s.enemies) {
    const ex = e.x - ox - 6, ey = e.y - 6;
    ctx.fillStyle = "#c678dd";
    ctx.fillRect(ex, ey, 12, 12);
    ctx.fillStyle = "#1a1020";
    ctx.fillRect(ex + 2, ey + 3, 3, 3);
    ctx.fillRect(ex + 7, ey + 3, 3, 3);
  }

  // Player — rectangle; blinks while invulnerable.
  if (!s.invuln || (s.tick >> 2) & 1) {
    ctx.fillStyle = s.invuln ? "#ffffff" : "#7aa2f7";
    ctx.fillRect(s.x - ox - 5, s.y - 7, 10, 14);
    // A notch showing which way it faces.
    ctx.fillStyle = "#0d1119";
    ctx.fillRect(s.x - ox - 5 + (s.facing > 0 ? 6 : 1), s.y - 4, 3, 3);
  }

  // Goal marker on the minimap strip.
  ctx.fillStyle = "rgba(255,255,255,.10)";
  ctx.fillRect(0, 0, VIEW_W, 3);
  ctx.fillStyle = "#7aa2f7";
  ctx.fillRect((s.x / (LEVEL_W * TILE)) * VIEW_W - 1, 0, 3, 3);
}

function updateHud(s) {
  $("s-score").textContent = s.score.toString();
  $("s-lives").textContent = "♥".repeat(s.lives) || "—";
  $("s-coins").textContent = s.coins;
  $("s-tick").textContent = s.tick;
  $("s-log").textContent = inputLog.length;
}

// ---------------------------------------------------------------------------
// Main loop — fixed timestep
// ---------------------------------------------------------------------------
//
// The simulation must advance at exactly 60 ticks per second regardless of the
// display's refresh rate, because the tick count IS the clock the enclave
// replays against. Driving `step` straight from requestAnimationFrame would
// make a 120Hz monitor produce a different run from a 60Hz one.

let acc = 0, prev = 0;

function frame(now) {
  if (!running) return;
  if (!prev) prev = now;
  acc += now - prev;
  prev = now;

  // Cap catch-up so a backgrounded tab does not try to simulate thousands of
  // ticks in one frame and lock the page.
  if (acc > 250) acc = 250;

  let ended = false;
  while (acc >= TICK_MS && !ended) {
    ended = stepOnce();
    acc -= TICK_MS;
  }

  const s = readSnapshot();
  draw(s);
  updateHud(s);

  if (ended) return finish(s);
  requestAnimationFrame(frame);
}

function finish(s) {
  running = false;
  finalSnap = s;
  const verdict = s.won ? "REACHED THE GOAL" : (s.lives === 0 ? "OUT OF LIVES" : "TIME UP");
  overlay(`<h2>${verdict}</h2>
    local score <b>${s.score}</b> over ${s.tick} ticks<br>
    <span style="color:var(--dim)">${inputLog.length} log entries — now let the enclave recompute it</span>`);
  $("btn-attest").disabled = false;
  say(`\nrun ended: ${verdict.toLowerCase()}, local score ${s.score}, ${s.tick} ticks, ${inputLog.length} log entries`);
  say("this score is only a claim. press “Attest & submit”.", "");
}

const overlay = (html) => {
  $("overlayText").innerHTML = html;
  $("overlay").classList.add("show");
};
const hideOverlay = () => $("overlay").classList.remove("show");

// ---------------------------------------------------------------------------
// Session lifecycle
// ---------------------------------------------------------------------------

function startRun() {
  if (!session) return;
  if (handle) w.sim_destroy(handle);

  // BigInt: the seed is a full u64 and would lose precision as a JS number.
  handle = w.sim_create(BigInt(session.seed));
  if (!handle) throw new Error("sim_create failed");

  const n = w.sim_terrain(handle, terrainPtr, LEVEL_W * LEVEL_H);
  if (n < 0) throw new Error(`sim_terrain status ${n}`);
  terrain = bytes().slice(terrainPtr, terrainPtr + n);

  inputLog = [];
  steps = 0;
  lastButtons = 0;
  held.clear();
  finalSnap = null;
  acc = 0; prev = 0;
  running = true;

  $("btn-attest").disabled = true;
  hideOverlay();
  requestAnimationFrame(frame);
}

const api = (path, body) =>
  fetch(path, {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify(body),
  }).then(async (r) => {
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error ?? `HTTP ${r.status}`);
    return j;
  });

$("btn-session").onclick = async () => {
  const btn = $("btn-session");
  btn.disabled = true;
  try {
    const verifier = $("verifier").value.trim();
    if (!verifier) throw new Error("verifier URL is required");

    say(`\nrequesting a session seed from the enclave…`);
    session = await api("/api/session", {
      verifier,
      player: $("player").value.trim(),
      k: Number($("k").value),
    });

    $("s-seed").textContent = session.seed;
    say(`epoch ${session.epoch} slot ${session.k} — seed ${session.seed}`, "ok");
    say(`sessionId ${session.sessionId}`);
    say(`the level below was generated from that seed, inside sim.wasm.`);
    startRun();
  } catch (e) {
    say(`session failed: ${e.message}`, "bad");
  } finally {
    btn.disabled = false;
  }
};

$("btn-attest").onclick = async () => {
  const btn = $("btn-attest");
  btn.disabled = true;
  try {
    say(`\nsending ${inputLog.length} log entries to the enclave — no score is sent…`);
    const att = await api("/api/attest", {
      verifier: $("verifier").value.trim(),
      player: $("player").value.trim(),
      epoch: session.epoch,
      k: session.k,
      inputLog,
    });

    const enclave = BigInt(att.claim.score);
    const local = finalSnap.score;
    say(`enclave replayed ${att.ticks} ticks and computed ${enclave}`);
    if (enclave === local) {
      say(`AGREES with this browser (${local}) — same wasm, same log, same answer`, "ok");
    } else {
      say(`DISAGREES: browser said ${local}, enclave said ${enclave}`, "bad");
      say(`the enclave's number is the one that counts.`, "");
    }

    say(`\nsubmitting to the leaderboard contract…`);
    const sub = await api("/api/submit", {attestation: att});
    say(sub.output ?? "(no output)");
    say(`on-chain best for this player is now ${sub.best}`, sub.matches ? "ok" : "bad");
  } catch (e) {
    say(`attestation failed: ${e.message}`, "bad");
    btn.disabled = false;
  }
};

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------

const KEYS = {
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  Space: "jump", ArrowUp: "jump", KeyW: "jump",
};

addEventListener("keydown", (e) => {
  if (e.code === "KeyR" && session) { startRun(); return; }
  const k = KEYS[e.code];
  if (!k) return;
  e.preventDefault();
  held.add(k);
});
addEventListener("keyup", (e) => {
  const k = KEYS[e.code];
  if (!k) return;
  e.preventDefault();
  held.delete(k);
});
// A lost focus must release everything, or the player keeps running while the
// tab is not even active — and that lands in the input log as real input.
addEventListener("blur", () => held.clear());

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

const cfg = await fetch("/api/config").then((r) => r.json()).catch(() => ({}));
if (cfg.verifier) $("verifier").value = cfg.verifier;
if (cfg.player) $("player").value = cfg.player;

say(`sim.wasm loaded — ABI ${w.sim_abi_version()}, level ${LEVEL_W}×${LEVEL_H} tiles, ${SNAP_SIZE}-byte snapshots`);
say(`rulesHash is computed from these exact bytes; the enclave must be running the same ones.`);
overlay(`<h2>Rainbow</h2>press <b>New session</b> to get a seed from the enclave`);
</script>
</body>
</html>
