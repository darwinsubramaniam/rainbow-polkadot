[workspace]
resolver = "3"
members = [
    "crates/sim",
    "crates/sim-wasm",
    "crates/replay",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sim = { path = "crates/sim" }
# Latest *stable* wasmi. 2.0 is currently only a beta, and this interpreter is
# the component the entire attestation guarantee rests on — a prerelease is the
# wrong place to take that risk. Revisit when 2.0 ships stable.
wasmi = { version = "1.1.0", default-features = false }
anyhow = "1.0.104"

# Determinism: identical codegen settings on every target. Pinning these removes
# any question about whether optimisation level can affect integer results.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
