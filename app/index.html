<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rainbow — a platformer whose score is proven, not claimed</title>
    <meta
      name="description"
      content="Play a platformer, then watch a TEE on the Acurast network replay your keypresses, recompute the score itself, and sign it for a contract on Polkadot Asset Hub."
    />
    <meta name="theme-color" content="#ffffff" />

    <!--
      The mark. favicon.svg is a reduced cut of RainbowMark — five heavy dots on
      the inner arc rather than seven light ones, because at 16px the light ones
      fall under a device pixel. apple-touch-icon.png is opaque and padded: iOS
      masks it to a rounded square and supplies no ground of its own.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Plus Jakarta Sans for display, Geist for body, Geist Mono for data. Loaded
      from a third-party origin, which the Product sandbox permits (docs/E0.1).
      If it is ever blocked, the stacks in styles.css fall back to
      system-ui/ui-monospace and the layout is unchanged.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
